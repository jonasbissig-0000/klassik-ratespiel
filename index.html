<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b24"><title>CHRONOS · Klassik / Clásica</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#f4f0e9;background:radial-gradient(ellipse at top,#303849,#10141b 76%)}main{width:min(460px,100%);background:#1b222c;border:1px solid #4c4950;border-radius:22px;padding:28px 25px;text-align:center;box-shadow:0 22px 75px #0007}.eyebrow{color:#e1c38b;letter-spacing:.16em;font-size:11px;font-weight:750}h1{font:normal 39px Georgia,serif;margin:12px 0 4px}p{line-height:1.5}.muted{color:#b8bbc1;font-size:14px}.symbol{font-size:66px;color:#e1c38b;margin:26px 0 5px}.player{background:#29313c;border-radius:15px;padding:18px 14px}audio{width:100%}button{font:inherit;border-radius:10px}button{cursor:pointer;padding:13px 17px;font-weight:700;border:1px solid #c7a66f;background:transparent;color:#e1c38b}button:hover{background:#37352e}button:focus-visible{outline:3px solid white;outline-offset:3px}.wide{width:100%;margin:16px 0 0}.solution{padding:19px 12px;background:#262e39;border:1px solid #796748;border-radius:14px;margin-top:16px}.solution h2{font:normal 25px Georgia,serif;margin:10px 0}.solution .work{font-size:17px}.solution .movement{font-size:14px;color:#d5d2cf}.solution .people{white-space:pre-line;line-height:1.6;margin:13px 0 0}.solution .year{font-size:29px;color:#e1c38b;margin:10px 0 5px}#error{color:#ffbbbb}[hidden]{display:none!important}</style></head><body><main>
<div class="eyebrow">CHRONOS · KLASSIK / CLÁSICA</div><h1>Höre die Zeit</h1><p class="muted">Hören · Einordnen / Escuchar · Ordenar</p><div class="symbol" aria-hidden="true">◉</div><div class="player"><audio id="player" controls preload="metadata" aria-label="Musik / Música"></audio><p class="muted" id="audioLabel">▶ Abspielen / Reproducir</p></div><p id="error" role="alert" hidden></p><button id="reveal" class="wide" aria-expanded="false">Lösung anzeigen / Mostrar solución</button>
<section class="solution" id="solution" hidden aria-live="polite"><div class="eyebrow">AUFLÖSUNG / SOLUCIÓN</div><div id="solutionContent"></div></section></main>
<script>
const player=document.getElementById('player'),solution=document.getElementById('solution'),reveal=document.getElementById('reveal'),content=document.getElementById('solutionContent'),error=document.getElementById('error');let cards=[],current=null;const requested=new URLSearchParams(location.search).get('karte');
function element(tag,className,value){const node=document.createElement(tag);if(className)node.className=className;node.textContent=value;return node}
function fillSolution(c){
  content.replaceChildren();
  if(c.solution?.trim()){
    for(const line of c.solution.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))content.append(element('p','people',line));
    return;
  }
  if(c.year)content.append(element('div','year',String(c.year)));
  content.append(element('h2','',c.composer||''));
  content.append(element('div','work',c.title||''));
  if(c.movement)content.append(element('div','movement',c.movement));
  const credits=[['Dirigent / Dirección',c.conductor],['Orchester / Orquesta',c.ensemble],['Solistinnen und Solisten / Solistas',c.soloists]];
  for(const [label,value] of credits){if(value&&String(value).trim())content.append(element('p','people',label+': '+value));}
}
function show(id){
  current=cards.find(c=>c.id===id)||cards[0];if(!current)return;
  // Die Kartennummer dient nur der unsichtbaren Dateizuordnung.
  // Ein expliziter Pfad in karten.json ist optional: Standard ist audio/001.mp3 usw.
  const audioPath=String(current.audio||'').trim() || 'audio/'+String(current.id).padStart(3,'0')+'.mp3';
  player.pause();
  player.src=audioPath;
  player.hidden=false;
  document.getElementById('audioLabel').textContent='▶ Abspielen / Reproducir';
  solution.hidden=true;
  reveal.textContent='Lösung anzeigen / Mostrar solución';reveal.setAttribute('aria-expanded','false');
  fillSolution(current);error.hidden=true;player.load();
  history.replaceState({},'', '?karte='+encodeURIComponent(current.id));
}
reveal.addEventListener('click',()=>{solution.hidden=!solution.hidden;reveal.textContent=solution.hidden?'Lösung anzeigen / Mostrar solución':'Lösung verbergen / Ocultar solución';reveal.setAttribute('aria-expanded',String(!solution.hidden))});player.addEventListener('error',()=>{error.textContent='Audiodatei nicht gefunden / Audio no disponible. Bitte prüfen, ob die MP3-Datei im Ordner audio/ liegt.';error.hidden=false;document.getElementById('audioLabel').textContent='Audio nicht verfügbar / Audio no disponible';});
fetch('karten.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{cards=data;show(requested)}).catch(()=>{error.textContent='Kartendaten konnten nicht geladen werden. Bitte über GitHub Pages öffnen. / No se pudieron cargar los datos.';error.hidden=false});
</script></body></html>
