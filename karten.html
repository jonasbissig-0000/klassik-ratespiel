<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CHRONOS – Druckkarten</title><style>body{font-family:Arial,sans-serif;margin:20px;color:#222}header{max-width:850px;margin:auto}.cards{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}.card{width:62mm;height:90mm;border:1px solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid;padding:10px;box-sizing:border-box}.card img{width:43mm;height:43mm}.label{font-size:11px;letter-spacing:2px}.id{font-size:26px;margin:10px}.help{font-size:11px;text-align:center}input{padding:9px;width:min(100%,470px)}button{padding:10px;cursor:pointer}@media print{header{display:none}body{margin:5mm}.cards{gap:3mm}.card{border:1px solid #999}}</style></head><body><header><h1>CHRONOS – QR-Karten</h1><p>Trage zuerst die endgültige öffentliche URL deiner Webseite ein (ohne <code>index.html</code>). Danach «Karten aktualisieren» und drucken. Die QR-Grafiken werden von api.qrserver.com erzeugt. Dabei wird die jeweilige Karten-URL an den Dienst übertragen.</p><input id="base" aria-label="Basis-URL" placeholder="https://BENUTZERNAME.github.io/klassik-hitster/"><button id="make">Karten aktualisieren</button><button onclick="window.print()">Drucken</button><p id="notice"></p></header><div class="cards" id="cards"></div><script>
const ids=['001','002','003','004','005'];const field=document.querySelector('#base');field.value=location.protocol.startsWith('http')?new URL('./',location.href).href:'';function make(){const base=field.value.trim();const holder=document.querySelector('#cards');holder.replaceChildren();document.querySelector('#notice').textContent=base?'Jede Karte verweist auf '+base:'Bitte zuerst die öffentliche Webseitenadresse eintragen.';if(!base)return;for(const id of ids){const card=document.createElement('div');card.className='card';const label=document.createElement('div');label.className='label';label.textContent='CHRONOS · CLASSICAL';const num=document.createElement('div');num.className='id';num.textContent=id;const qr=document.createElement('div');const foot=document.createElement('div');foot.className='help';foot.textContent='Scannen · Hören · Einordnen';card.append(label,num,qr,foot);holder.append(card);const img=document.createElement('img');img.alt='QR-Code Karte '+id;img.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(new URL('index.html?karte='+id,base).href);qr.append(img)}}
document.querySelector('#make').onclick=make;make();</script></body></html>
