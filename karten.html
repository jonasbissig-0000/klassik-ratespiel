<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHRONOS – Karten / Tarjetas</title><style>body{font-family:system-ui,sans-serif;margin:14px;color:#181818}header{max-width:900px;margin:0 auto 18px}input{width:min(440px,95%);padding:9px}button{padding:10px;margin:5px}.sheet{display:grid;grid-template-columns:repeat(3,63mm);gap:5mm;justify-content:center}.card{width:63mm;height:88mm;border:1px solid #aaa;box-sizing:border-box;break-inside:avoid;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:9mm 4mm;background:#f8f3e8}.front{background:#202631;color:#e6cb96}.front img{height:41mm;width:41mm;background:white;padding:3mm;box-sizing:border-box}.brand{font-size:10px;letter-spacing:2px}.id{font-size:13px}.year{font-family:Georgia,serif;font-size:33px}.title{font:16px Georgia,serif}.work{font-size:13px}.small{font-size:11px}.pagebreak{break-before:page;page-break-before:always}#notice{color:#555}@media print{@page{size:A4;margin:8mm}header{display:none}.sheet{gap:2mm;grid-template-columns:repeat(3,63mm)}.card{border:1px solid #888}body{margin:0}.pagebreak{break-before:page;page-break-before:always}}</style></head><body><header><h1>CHRONOS · Karten / Tarjetas</h1><p>QR-Vorderseiten und Auflösungs-Rückseiten. Für echten Duplexdruck zunächst eine Testseite drucken; Drucker wenden unterschiedlich. QR-Codes werden von api.qrserver.com geladen und übermitteln die Karten-URL an diesen Dienst.</p><input id="base" placeholder="https://name.github.io/klassik-ratespiel/"><button onclick="generate()">Aktualisieren / Actualizar</button><button onclick="window.print()">Drucken / Imprimir</button><p id="notice"></p></header><div id="pages"></div><script>
let cards=[];const base=document.getElementById('base');if(location.protocol.startsWith('http'))base.value=new URL('./',location.href).href;
function cardNode(c,back,baseURL){const node=document.createElement('div');node.className='card '+(back?'back':'front');function line(cls,value){const p=document.createElement('div');p.className=cls;p.textContent=value;node.append(p)}line('brand','CHRONOS');if(back){line('year',c.year||'');line('title',c.composer||'');line('work',c.title||'');if(c.movement)line('small',c.movement);if(c.vocalBonus)line('small',c.vocalBonus);line('id',c.id)}else{line('id','№ '+c.id);const img=document.createElement('img');img.alt='QR-Code '+c.id;img.src='https://api.qrserver.com/v1/create-qr-code/?size=280x280&data='+encodeURIComponent(new URL('index.html?karte='+encodeURIComponent(c.id),baseURL).href);node.append(img);line('small','Scannen / Escanear')}return node}
function generate(){const pages=document.getElementById('pages');pages.replaceChildren();let url;try{url=new URL(base.value.trim());if(!/^https?:$/.test(url.protocol))throw Error()}catch{document.getElementById('notice').textContent='Bitte gültige URL eintragen / Introduce una URL válida';return}document.getElementById('notice').textContent='Vorderseiten und Rückseiten in Gruppen bis zu 9 Karten. Duplexausrichtung unbedingt testen.';for(let k=0;k<cards.length;k+=9){const part=cards.slice(k,k+9);const fronts=document.createElement('div');fronts.className='sheet';part.forEach(c=>fronts.append(cardNode(c,false,url)));pages.append(fronts);const backs=document.createElement('div');backs.className='sheet pagebreak';for(let i=0;i<part.length;i+=3){part.slice(i,i+3).reverse().forEach(c=>backs.append(cardNode(c,true,url)))}pages.append(backs);if(k+9<cards.length){const spacer=document.createElement('div');spacer.className='pagebreak';pages.append(spacer)}}}
fetch('karten.json').then(r=>r.json()).then(data=>{cards=data;generate()}).catch(()=>{document.getElementById('notice').textContent='Daten nicht verfügbar – bitte über GitHub Pages öffnen.'});</script></body></html>
